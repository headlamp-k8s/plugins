apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: default-deployments-daily
  namespace: velero
spec:
  schedule: '0 7 * * *'
  template:
    includedNamespaces:
      - default
    includedResources:
      - deployments
    labelSelector:
      matchLabels:
        backup: enabled
---
# Covered by default-deployments-daily (backup=enabled in default)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: default
  labels:
    app: nginx-demo
    backup: enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
