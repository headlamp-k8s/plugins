kind: Restore
metadata:
  name: restore-from-default-daily
  namespace: velero
spec:
  backupName: default-deployments-daily-20261001070000
  includedNamespaces:
    - default
  restorePVs: true
status:
  phase: Completed
  errors: 0
  warnings: 1
  startTimestamp: '2026-10-02T10:00:00Z'
  completionTimestamp: '2026-10-02T10:03:20Z'
  progress:
    totalItems: 12
    itemsRestored: 12
