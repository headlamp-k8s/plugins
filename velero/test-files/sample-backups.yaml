# Demo Backup CRs for Headlamp Velero → Backups UI (and last-backup on Schedules).
# Safe to apply without a running Velero controller / BSL — objects are for UI verification.
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: default-deployments-daily-20261001070000
  namespace: velero
  labels:
    velero.io/schedule-name: default-deployments-daily
spec:
  includedNamespaces:
    - default
  includedResources:
    - deployments
  labelSelector:
    matchLabels:
      backup: enabled
  ttl: 720h
status:
  phase: Completed
  startTimestamp: '2026-10-01T07:00:00Z'
  completionTimestamp: '2026-10-01T07:02:15Z'
