apiVersion: v1
kind: Node
metadata:
  name: kwok-worker
  annotations:
    kwok.x-k8s.io/node: fake
  labels:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: kwok-worker
    kubernetes.io/os: linux
    node-role.kubernetes.io/worker: ''
status:
  allocatable:
    cpu: '32'
    memory: 128Gi
    pods: '110'
  capacity:
    cpu: '32'
    memory: 128Gi
    pods: '110'
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: kmesh-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-e2e-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp-e2e
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-waypoint
  namespace: demo
spec:
  gatewayClassName: kmesh-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
status:
  conditions:
    - type: Programmed
      status: 'True'
      reason: Programmed
      message: Waypoint is programmed
      lastTransitionTime: '2026-08-18T08:00:00Z'
---
apiVersion: kmesh.net/v1alpha1
kind: KmeshNodeInfo
metadata:
  name: kwok-worker
  namespace: kmesh-system
spec:
  spi: 5
  addresses:
    - 10.0.0.1
  bootID: boot-e2e-worker
  podCIDRS:
    - 10.244.0.0/24
---
apiVersion: kmesh.net/v1alpha1
kind: KmeshNodeInfo
metadata:
  name: kwok-worker-stale
  namespace: kmesh-system
spec:
  spi: 4
  addresses:
    - 10.0.0.2
  bootID: boot-e2e-stale
  podCIDRS:
    - 10.244.1.0/24
