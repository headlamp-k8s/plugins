version: 0.1.0-alpha
name: "headlamp_kmesh"
displayName: Kmesh
createdAt: "2026-08-02T10:00:00Z"
logoURL: "https://raw.githubusercontent.com/kmesh-net/kmesh/main/docs/pics/logo/KMESH-horizontal-colour.png"
description: A Headlamp plugin for monitoring and debugging Kmesh (high-performance eBPF-based service mesh in Kubernetes).
changes:
  - kind: added
    description: "Add Waypoints list and detail views with image and condition health tracking."
  - kind: added
    description: "Add Daemon Health Dashboard showing each Kmesh daemon pod's readiness and status."
  - kind: added
    description: "Add xDS Config Dump viewer to live-inspect kernel-native ADS clusters, listeners, and routing rules."
  - kind: added
    description: "Add Observability Panel to inspect BPF telemetry metrics and traffic stats directly from daemon pods."
  - kind: added
    description: "Add Authorization Policies viewer to track zero-trust L4 security rules in eBPF."
  - kind: added
    description: "Add eBPF Map Viewer to inspect live kernel BPF maps for dual-engine daemon."
  - kind: added
    description: "Add KmeshNodeInfo IPsec visualization for node security state."
  - kind: added
    description: "Add visual enrollment indicators for namespaces and waypoints."
annotations:
  headlamp/plugin/archive-url: "https://github.com/headlamp-k8s/plugins/releases/download/kmesh-0.1.0-alpha/headlamp-k8s-kmesh-0.1.0-alpha.tar.gz"
  headlamp/plugin/archive-checksum: "SHA256:77453c6451177f465ac4dee6da8ae58863f74ade55fd76c8816714429c19dde4"
  headlamp/plugin/version-compat: ">=0.22"
  headlamp/plugin/distro-compat: in-cluster,web,docker-desktop,desktop
