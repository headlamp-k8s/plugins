name: Test plugin release preparation

on:
  pull_request:
    paths:
      - 'scripts/*plugin-release*'
      - '.github/workflows/*plugin-release*'
  push:
    branches: [main]
    paths:
      - 'scripts/*plugin-release*'
      - '.github/workflows/*plugin-release*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test scripts/plugin-release.test.mjs
