name: Prepare signed plugin release

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Top-level plugin directory; its committed package.json supplies the version'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PLUGIN: ${{ inputs.plugin }}
    steps:
      - name: Require the trusted workflow source
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prepare releases from main so the workflow and provenance identify the built source."
          exit 1

      - name: Checkout the workflow source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Validate release inputs
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/prepare-plugin-release.mjs validate "$PLUGIN" "$RUNNER_TEMP/plugin-release"

      - name: Build and package once
        shell: bash
        run: |
          cd "$PLUGIN"
          npm ci
          npm run build
          npm run package -- . "$RUNNER_TEMP/plugin-release"

      - name: Record archive checksum and source
        shell: bash
        run: node scripts/prepare-plugin-release.mjs stage "$PLUGIN" "$RUNNER_TEMP/plugin-release" "$GITHUB_SHA"

      - name: Attest the produced archive
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/plugin-release/*.tar.gz

      - name: Stage provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          files=("$RUNNER_TEMP/plugin-release/"*.tar.gz)
          test "${#files[@]}" = 1
          cp "$BUNDLE_PATH" "${files[0]}.intoto.jsonl"

      - name: Save release inputs for failed-job reruns
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release
          path: ${{ runner.temp }}/plugin-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download this run's archive and provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release
          path: ${{ runner.temp }}/plugin-release

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign, stage, and verify the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          node scripts/publish-plugin-release.mjs "$RUNNER_TEMP/plugin-release" | tee "$RUNNER_TEMP/release-summary.txt"
          cat "$RUNNER_TEMP/release-summary.txt" >> "$GITHUB_STEP_SUMMARY"
