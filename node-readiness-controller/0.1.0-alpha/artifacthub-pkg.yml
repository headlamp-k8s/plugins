version: 0.1.0-alpha
name: headlamp_node_readiness_controller
displayName: Node Readiness Controller
createdAt: "2026-11-08T00:00:00Z"
description: A read-only Headlamp UI for Node Readiness Controller rules, readiness conditions, managed taints, and dry-run simulation results.
license: Apache-2.0
homeURL: https://github.com/headlamp-k8s/plugins/tree/main/node-readiness-controller
keywords:
  - headlamp
  - headlamp-plugin
  - kubernetes
  - node-readiness-controller
  - readiness
  - taints
screenshots:
  - title: Node Readiness Rules overview
    url: https://github.com/user-attachments/assets/64c15533-7570-47b0-9a60-39e7bfc127fa
  - title: Rule details and readiness conditions
    url: https://github.com/user-attachments/assets/5292707b-02a9-4f99-99dc-c7f755b2b615
