    url: https://github.com/user-attachments/assets/f6adc249-cbf0-461d-b1ba-23073a373d9a
changes:
  - kind: added
    description: "Add dedicated sidebar navigation and a cluster-scoped NodeReadinessRule list."
  - kind: added
    description: "Show rule status, managed taints, node selectors, enforcement mode, and condition policy."
  - kind: added
    description: "Add read-only rule details with metadata, condition requirements, fallback states, and evaluation status."
  - kind: added
    description: "Display existing dry-run results with affected nodes, predicted taint additions/removals, risky operations, and evaluation errors."
  - kind: added
    description: "Include isolated sample fixtures, status-seeding guidance, and registration, detail-view, and status regressions."
