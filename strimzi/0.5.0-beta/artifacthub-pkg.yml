changes:
  - kind: added
    description: "Add KafkaConnect list and detail views"
  - kind: added
    description: "Add KafkaConnector support with pause and resume actions"
  - kind: added
    description: "Add resource map integration for Kafka topics, users, Connect clusters, and connectors"
  - kind: added
    description: "Add runtime detection of the served Strimzi API version"
  - kind: changed
    description: "Declare both v1 and v1beta2 on resource classes for Strimzi 1.x and older clusters"
  - kind: changed
    description: "Mask credential-like keys in connector configurations"
  - kind: changed
    description: "Show a neutral Unknown chip when the Ready condition is Unknown"
  - kind: changed
    description: "Update headlamp-plugin to 0.14.0 and refresh dependencies"
  - kind: fixed
    description: "Fix empty Kafka cluster lists and detail pages on Strimzi 1.x"
  - kind: fixed
    description: "Fix crashes on Kafka Topics and Users pages while the cluster list is loading"
  - kind: fixed
    description: "Refresh connector action buttons when connector state changes"
  - kind: fixed
    description: "Handle missing Strimzi CRDs gracefully"
annotations:
