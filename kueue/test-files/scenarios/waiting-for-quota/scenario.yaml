# job-a and job-b each need most of the 1 CPU quota, so whichever is admitted second waits.
# too-big-job asks for more than the quota and can never be admitted.
apiVersion: v1
kind: Namespace
metadata:
  name: kueue-waiting-for-quota
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: waiting-for-quota
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kueue-waiting-for-quota
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: '1'
            - name: memory
              nominalQuota: 1Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: waiting-for-quota
  namespace: kueue-waiting-for-quota
spec:
  clusterQueue: waiting-for-quota
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-a
  namespace: kueue-waiting-for-quota
  labels:
    kueue.x-k8s.io/queue-name: waiting-for-quota
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 600m
              memory: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-b
  namespace: kueue-waiting-for-quota
  labels:
    kueue.x-k8s.io/queue-name: waiting-for-quota
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 600m
              memory: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: too-big-job
  namespace: kueue-waiting-for-quota
  labels:
    kueue.x-k8s.io/queue-name: waiting-for-quota
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: '64'
              memory: 64Mi
