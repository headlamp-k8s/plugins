# Preempts low-priority-job from scenario.yaml, which is then evicted and requeued.
apiVersion: batch/v1
kind: Job
metadata:
  name: high-priority-job
  namespace: kueue-preemption
  labels:
    kueue.x-k8s.io/queue-name: preemption
    kueue.x-k8s.io/priority-class: preemption-high
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 800m
              memory: 64Mi
