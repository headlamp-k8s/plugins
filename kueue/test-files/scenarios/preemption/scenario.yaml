# low-priority-job is admitted first. Apply high-priority-job.yaml afterwards to preempt it.
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: preemption-low
value: 100
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: preemption-high
value: 1000
---
apiVersion: v1
kind: Namespace
metadata:
  name: kueue-preemption
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: preemption
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kueue-preemption
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: '1'
            - name: memory
              nominalQuota: 1Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: preemption
  namespace: kueue-preemption
spec:
  clusterQueue: preemption
---
apiVersion: batch/v1
kind: Job
metadata:
  name: low-priority-job
  namespace: kueue-preemption
  labels:
    kueue.x-k8s.io/queue-name: preemption
    kueue.x-k8s.io/priority-class: preemption-low
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 800m
              memory: 64Mi
