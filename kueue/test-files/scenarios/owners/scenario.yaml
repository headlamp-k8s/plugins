# Workloads owned by a Job and by a plain Pod, for the owner links on the Workload detail page.
apiVersion: v1
kind: Namespace
metadata:
  name: kueue-owners
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: owners
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kueue-owners
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: '1'
            - name: memory
              nominalQuota: 1Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: owners
  namespace: kueue-owners
spec:
  clusterQueue: owners
---
apiVersion: batch/v1
kind: Job
metadata:
  name: owned-by-job
  namespace: kueue-owners
  labels:
    kueue.x-k8s.io/queue-name: owners
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: owned-by-pod
  namespace: kueue-owners
  labels:
    kueue.x-k8s.io/queue-name: owners
spec:
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:1.36
      command:
        - sleep
        - '3600'
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
