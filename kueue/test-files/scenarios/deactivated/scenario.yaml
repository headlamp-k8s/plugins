# Kueue admits deactivated-job; deactivate its Workload afterwards to see it evicted.
apiVersion: v1
kind: Namespace
metadata:
  name: kueue-deactivated
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: deactivated
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kueue-deactivated
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: '1'
            - name: memory
              nominalQuota: 1Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: deactivated
  namespace: kueue-deactivated
spec:
  clusterQueue: deactivated
---
apiVersion: batch/v1
kind: Job
metadata:
  name: deactivated-job
  namespace: kueue-deactivated
  labels:
    kueue.x-k8s.io/queue-name: deactivated
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
