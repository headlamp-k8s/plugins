# The ClusterQueue needs an AdmissionCheck that no controller implements.
# Until the check is marked Active the ClusterQueue is inactive; after that the Workload waits on the check.
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: scenario-approval
spec:
  # No controller implements this check, so it stays Pending until it is approved by hand.
  controllerName: example.com/scenario-approval
---
apiVersion: v1
kind: Namespace
metadata:
  name: kueue-admission-checks
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: admission-checks
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kueue-admission-checks
  admissionChecksStrategy:
    admissionChecks:
      - name: scenario-approval
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: '1'
            - name: memory
              nominalQuota: 1Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: admission-checks
  namespace: kueue-admission-checks
spec:
  clusterQueue: admission-checks
---
apiVersion: batch/v1
kind: Job
metadata:
  name: needs-approval-job
  namespace: kueue-admission-checks
  labels:
    kueue.x-k8s.io/queue-name: admission-checks
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sleep
            - '3600'
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
