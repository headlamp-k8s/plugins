# Can read Clusters and Backups, but not ScheduledBackups.
#
# The mirror of reader-no-backups, and the pair that matters: bind both
# ClusterRoles to one account and the insights panel has to name two denied
# rules on two separate lines. Run end to end they read as one malformed rule,
# because each already starts with a verb and ends with a scope.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-reader-no-scheduledbackups
  namespace: cnpg-headlamp-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-reader-no-scheduledbackups
rules:
  - apiGroups: ['postgresql.cnpg.io']
    resources: ['clusters', 'backups']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['namespaces']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apiextensions.k8s.io']
    resources: ['customresourcedefinitions']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-reader-no-scheduledbackups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-reader-no-scheduledbackups
subjects:
  - kind: ServiceAccount
    name: cnpg-reader-no-scheduledbackups
    namespace: cnpg-headlamp-test
