apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-app-label
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-for-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "validation error: the 'app' label is required on all Pods."
        pattern:
          metadata:
            labels:
              app: "?*"
