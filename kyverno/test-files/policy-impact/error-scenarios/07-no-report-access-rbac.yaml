# The genuine error path: an identity that can read policies but has no
# access to wgpolicyk8s.io at all. Viewing EITHER policy below with this
# identity should hit the panel's queryError branch and show
# "Could not load report data for this policy: ..." instead of an empty
# state or a silent zero.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-impact-denied-viewer
  namespace: policy-impact-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: policy-impact-denied-viewer
rules:
  - apiGroups: ["kyverno.io"]
    resources: ["policies", "clusterpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: policy-impact-denied-viewer
subjects:
  - kind: ServiceAccount
    name: policy-impact-denied-viewer
    namespace: policy-impact-a
roleRef:
  kind: ClusterRole
  name: policy-impact-denied-viewer
  apiGroup: rbac.authorization.k8s.io
