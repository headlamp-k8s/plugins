# ClusterPolicy: require an "app" label on every Pod across all namespaces.
# Produces ClusterPolicyReport results for cluster-scoped resources and
# PolicyReport results (namespace-scoped) for namespaced Pods, so both list
# types get exercised by collectPolicyImpact. Expect a red (failing) policy
# node in the Map view once 03 and 04 workloads are applied.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ms-require-app-label
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - map-source-test
      validate:
        message: "Every Pod must carry an 'app' label."
        pattern:
          metadata:
            labels:
              app: "?*"
