changes:
  - kind: added
    description: "Connect to the PipeCD APIService over gRPC-Web with configurable server URL, API key, and a connection test."
  - kind: added
    description: "Keep API keys in memory only, persist only the server URL, and remove previously persisted keys."
  - kind: added
    description: "List applications across all pages, with name/repository search, platform filtering, and sync status."
  - kind: added
    description: "Show application and deployment details, pipeline stages, stage logs, and links to the PipeCD web UI."
  - kind: added
    description: "Start Sync, Quick Sync, or Pipeline Sync after confirmation with a read-write API key; disable sync for disabled applications."
  - kind: added
    description: "Add an Overview with pipeds, application and deployment counts, change failure rate, deployment status charts, and recent deployments."
  - kind: added
    description: "Show online/offline piped status on newer PipeCD servers and pod status when the piped runs in the selected Kubernetes cluster."
  - kind: added
    description: "Include regression tests for API mapping, settings, pagination, overview summaries, status labels, sync, and detail pages."
annotations:
