apiVersion: batch/v1
kind: Job
metadata:
  name: payments-burst
  namespace: knative-eventing-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: send
          image: curlimages/curl:8.10.1
          command: [sh, -c]
          args:
            - |
              for i in $(seq 1 100); do
                curl -s -o /dev/null -X POST \
                  http://payments-kafka-kn-channel.knative-eventing-test.svc.cluster.local \
                  -H 'Ce-Specversion: 1.0' -H 'Ce-Type: payments.burst' \
                  -H "Ce-Id: payment-$i" -H 'Ce-Source: payments-burst' \
                  -H 'Content-Type: application/json' -d "{\"payment\": $i}"
              done
