apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: orders-ping
  namespace: knative-eventing-test
spec:
  schedule: '*/1 * * * *'
  contentType: application/json
  data: '{"message": "Hello from orders-ping"}'
  sink:
    ref:
      apiVersion: messaging.knative.dev/v1
      kind: Channel
      name: orders
---
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: orders-kafka-ping
  namespace: knative-eventing-test
spec:
  schedule: '*/1 * * * *'
  contentType: application/json
  data: '{"message": "Hello from orders-kafka-ping"}'
  sink:
    ref:
      apiVersion: messaging.knative.dev/v1beta1
      kind: KafkaChannel
      name: orders-kafka
---
apiVersion: messaging.knative.dev/v1
kind: Subscription
metadata:
  name: orders-rejected
  namespace: knative-eventing-test
spec:
  channel:
    apiVersion: messaging.knative.dev/v1
    kind: Channel
    name: orders
  subscriber:
    uri: http://example.com/events
---
apiVersion: messaging.knative.dev/v1
kind: Subscription
metadata:
  name: orders-kafka-rejected
  namespace: knative-eventing-test
spec:
  channel:
    apiVersion: messaging.knative.dev/v1beta1
    kind: KafkaChannel
    name: orders-kafka
  subscriber:
    uri: http://example.com/events
---
apiVersion: messaging.knative.dev/v1
kind: Subscription
metadata:
  name: payments-stalled
  namespace: knative-eventing-test
spec:
  channel:
    apiVersion: messaging.knative.dev/v1
    kind: Channel
    name: payments-kafka
  subscriber:
    uri: http://10.255.255.1/
  delivery:
    retry: 1
---
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: orders-nats-ping
  namespace: knative-eventing-test
spec:
  schedule: '*/1 * * * *'
  contentType: application/json
  data: '{"message": "Hello from orders-nats-ping"}'
  sink:
    ref:
      apiVersion: messaging.knative.dev/v1alpha1
      kind: NatsJetStreamChannel
      name: orders-nats
---
apiVersion: messaging.knative.dev/v1
kind: Subscription
metadata:
  name: orders-nats-rejected
  namespace: knative-eventing-test
spec:
  channel:
    apiVersion: messaging.knative.dev/v1alpha1
    kind: NatsJetStreamChannel
    name: orders-nats
  subscriber:
    uri: http://example.com/events
---
apiVersion: messaging.knative.dev/v1
kind: Subscription
metadata:
  name: orders-nats-stalled
  namespace: knative-eventing-test
spec:
  channel:
    apiVersion: messaging.knative.dev/v1alpha1
    kind: NatsJetStreamChannel
    name: orders-nats
  subscriber:
    uri: http://10.255.255.1/
  delivery:
    retry: 1
    backoffPolicy: linear
    backoffDelay: PT1S
