apiVersion: v1
kind: Service
metadata:
  name: nats-monitoring
  namespace: nats-io
spec:
  selector: { app: nats }
  ports:
    - { name: monitoring, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-exporter
  namespace: nats-io
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats-exporter }
  template:
    metadata:
      labels: { app: nats-exporter }
    spec:
      containers:
        - name: nats-exporter
          image: natsio/prometheus-nats-exporter:0.17.3
          args: ['-jsz=all', 'http://nats-monitoring.nats-io.svc.cluster.local:8222']
          ports:
            - { name: metrics, containerPort: 7777 }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nats-exporter
  namespace: nats-io
spec:
  selector:
    matchLabels: { app: nats-exporter }
  podMetricsEndpoints:
    - port: metrics
