apiVersion: v1
kind: Namespace
metadata:
  name: nats-io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: nats-io
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ['-js', '-sd', '/data', '-m', '8222']
          ports:
            - containerPort: 4222
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats-io
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
