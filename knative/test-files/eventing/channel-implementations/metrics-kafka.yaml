apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-broker-dev-config
  namespace: knative-eventing-test
data:
  bootstrap.servers: my-cluster-kafka-bootstrap.kafka:9092
  default.topic.partitions: '3'
  default.topic.replication.factor: '1'
---
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: orders-kafka-broker
  namespace: knative-eventing-test
  annotations:
    eventing.knative.dev/broker.class: Kafka
spec:
  config:
    apiVersion: v1
    kind: ConfigMap
    name: kafka-broker-dev-config
    namespace: knative-eventing-test
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: kafka-broker-display
  namespace: knative-eventing-test
spec:
  broker: orders-kafka-broker
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: event-display
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: kafka-broker-rejected
  namespace: knative-eventing-test
spec:
  broker: orders-kafka-broker
  subscriber:
    uri: http://example.com/events
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: kafka-broker-stalled
  namespace: knative-eventing-test
spec:
  broker: orders-kafka-broker
  subscriber:
    uri: http://10.255.255.1/
  delivery:
    retry: 1
---
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: kafka-broker-ping
  namespace: knative-eventing-test
spec:
  schedule: '*/1 * * * *'
  contentType: application/json
  data: '{"message": "Hello from kafka-broker-ping"}'
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: orders-kafka-broker
---
apiVersion: eventing.knative.dev/v1alpha1
kind: KafkaSink
metadata:
  name: payments-sink
  namespace: knative-eventing-test
spec:
  topic: payments-events
  bootstrapServers:
    - my-cluster-kafka-bootstrap.kafka:9092
  numPartitions: 3
  replicationFactor: 1
---
apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: payments-sink-ping
  namespace: knative-eventing-test
spec:
  schedule: '*/1 * * * *'
  contentType: application/json
  data: '{"message": "Hello from payments-sink-ping"}'
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1alpha1
      kind: KafkaSink
      name: payments-sink
---
apiVersion: sources.knative.dev/v1
kind: KafkaSource
metadata:
  name: payments-source
  namespace: knative-eventing-test
spec:
  consumerGroup: payments-source
  bootstrapServers:
    - my-cluster-kafka-bootstrap.kafka:9092
  topics:
    - payments-events
  sink:
    ref:
      apiVersion: v1
      kind: Service
      name: event-display
