  - kind: changed
    description: "Update headlamp-plugin to 0.14.0 and refresh dependencies"
  - kind: fixed
    description: "Fix Helm inventory loading when the inventory is empty"
  - kind: fixed
    description: "Show 100% health when no Flux resources exist"
